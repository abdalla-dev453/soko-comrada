services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data

  backend:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      FLASK_ENV: production
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    command: >
      sh -c "flask db upgrade && exec gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 --timeout 30 --access-logfile - --error-logfile - wsgi:app"
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis-data:
